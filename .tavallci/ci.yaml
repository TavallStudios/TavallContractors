version: 2

source:
  repository: TavallStudios/TavallContractors
  provider: github

build:
  type: gradle
  java: 25
  gradle: 9.6.1

resources:
  mode: SYSTEM

dependencies:
  - kind: source
    identity: TavallStudios/tavall-cache
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-di
    role: SHARED_DEP
    selector: required-source
  - kind: source
    identity: TavallStudios/tavall-logging
    role: SHARED_DEP
    selector: required-source

artifacts:
  - name: tavall-contractors-application
    path: distribution/application.jar

requiredChecks:
  - quality

checks:
  quality:
    executor: gradle
    tasks:
      - "clean"
      - ":internal-contractor-api:clean"
      - ":spring-webview:clean"
      - "check"
      - ":internal-contractor-api:check"
      - ":spring-webview:check"
      - "assemble"
      - ":internal-contractor-api:assemble"
      - ":spring-webview:assemble"
